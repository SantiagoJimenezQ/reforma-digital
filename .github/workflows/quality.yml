name: Quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Run all 150 cases
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
  live-regression:
    # Configure repository variable LIVE_EVALS_ENABLED after human approval of golden and baseline.
    # Never use pull_request_target: untrusted PR code must not receive production secrets.
    if: vars.LIVE_EVALS_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: evaluations
    env:
      DATABASE_URL: ${{ secrets.EVAL_DATABASE_URL }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_BASE_URL: ${{ vars.LANGFUSE_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compare web search results with approved baseline
        run: pnpm eval --mode live --dataset ${{ inputs.full && 'full' || 'golden' }} --judges --compare baseline --ci --publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports
          path: artifacts/runs/
